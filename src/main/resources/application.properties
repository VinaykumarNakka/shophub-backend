spring.application.name=shophub
server.port=8080

# ---- MySQL (default). Override with env vars DB_USERNAME / DB_PASSWORD ----
spring.datasource.url=jdbc:mysql://localhost:3306/shophub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT (secret must be at least 32 characters) ----
shophub.jwt.secret=${JWT_SECRET:shophub-dev-secret-change-me-please-32chars-minimum}
shophub.jwt.expiration-ms=86400000

# ---- CORS (React dev server) ----
shophub.cors.origins=http://localhost:5173

# We use JWT, not the auto-generated default user
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
